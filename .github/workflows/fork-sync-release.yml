name: Fork sync and compat release

# 仅存在于 fork：同步上游 main，把「上游已打 tag 的版本 + fork 自有改动」在 Ubuntu 22.04 (GLIBC 2.35) 上重新构建发布。
# 上游 build.yml 保持原样，避免同步冲突。

on:
  workflow_dispatch:
    inputs:
      sync:
        description: 先同步上游 main
        type: boolean
        default: true
      force:
        description: 内容未变化时也发布新的修订版本
        type: boolean
        default: false
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: fork-sync-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: daodeqing/cpa-plugin-GFlow
  TAG_SUFFIX: -glibc2.35
  MAX_GLIBC: '2.35'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      upstream_sha: ${{ steps.plan.outputs.upstream_sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      key: ${{ steps.plan.outputs.key }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Sync fork main with upstream
        if: github.event_name == 'schedule' || inputs.sync
        env:
          # 上游改动 .github/workflows 时 GITHUB_TOKEN 无权同步，需要带 Workflows 写权限的 SYNC_TOKEN。
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          if ! out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main 2>&1); then
            echo "$out"
            echo "::error::同步上游失败。若上游修改了 workflow 文件，请配置仓库 secret SYNC_TOKEN（Contents + Workflows 读写）；若有冲突请手动合并。"
            exit 1
          fi
          echo "$out"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          upstream_tag="v$version"
          refs=$(git ls-remote "https://github.com/$UPSTREAM_REPOSITORY.git" "refs/tags/$upstream_tag" "refs/tags/$upstream_tag^{}")
          upstream_sha=$(echo "$refs" | awk '/\^\{\}$/{print $1}')
          [ -n "$upstream_sha" ] || upstream_sha=$(echo "$refs" | awk 'NF{print $1; exit}')
          if [ -z "$upstream_sha" ]; then
            echo "::notice::上游尚未发布 $upstream_tag，跳过。"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git merge-base --is-ancestor "$upstream_sha" HEAD || { echo "::error::上游 $upstream_tag 不在 fork main 历史中，请先同步。"; exit 1; }

          # fork 自有改动 = 最近一次合入的上游提交到 main 的差异（不含 workflow 文件）。
          git fetch -q --no-tags "https://github.com/$UPSTREAM_REPOSITORY.git" main
          base=$(git merge-base FETCH_HEAD HEAD)
          git diff --binary "$base" HEAD -- . ':(exclude).github/workflows' > "$RUNNER_TEMP/fork.patch"
          git log --no-merges --format='- %s (%h)' "$base..HEAD" -- . ':(exclude).github/workflows' > "$RUNNER_TEMP/fork-changes.md"
          key="$upstream_sha:$(sha256sum "$RUNNER_TEMP/fork.patch" | cut -c1-16)"

          prefix="v$version$TAG_SUFFIX"
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt \
            -q "[.[] | select(.isDraft | not) | select(.tagName == \"$prefix\" or (.tagName | startswith(\"$prefix-r\")))] | sort_by(.createdAt) | last | .tagName // empty")
          if [ -n "$latest" ] && gh release view "$latest" --repo "$GITHUB_REPOSITORY" --json body -q .body | grep -qF "fork-key: $key" && [ "$FORCE" != "true" ]; then
            echo "::notice::$latest 已包含当前内容（$key），无需构建。"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          existing=$(git ls-remote --tags origin | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u)
          tag=$prefix; n=1
          while echo "$existing" | grep -qx -- "$tag"; do n=$((n + 1)); tag="$prefix-r$n"; done

          git checkout -q --detach "$upstream_sha"
          if [ -s "$RUNNER_TEMP/fork.patch" ]; then
            git apply --index --3way "$RUNNER_TEMP/fork.patch" || { echo "::error::fork 改动无法应用到上游 $upstream_tag，请手动处理冲突。"; exit 1; }
            git commit -q -m "fork: $tag build of $upstream_tag" -m "$(cat "$RUNNER_TEMP/fork-changes.md")"
          fi
          sha=$(git rev-parse HEAD)
          git push -q -f origin "HEAD:refs/heads/fork-build/$tag"
          {
            echo "version=$version"; echo "tag=$tag"; echo "sha=$sha"; echo "upstream_sha=$upstream_sha"
            echo "key=$key"; echo "publish=true"
          } >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/fork-changes.md" fork-changes.md
          echo "### $tag ← $UPSTREAM_REPOSITORY@$upstream_tag + fork 改动 (\`$sha\`)" >> "$GITHUB_STEP_SUMMARY"
          cat fork-changes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          name: fork-changes
          path: fork-changes.md
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { goos: linux, goarch: arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { goos: darwin, goarch: arm64, runner: macos-14, target: aarch64-apple-darwin }
          - { goos: windows, goarch: amd64, runner: windows-2022, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install build and test dependencies
        run: python -B -m pip install -r python/flow2api/requirements.txt "pyinstaller==6.16.0" "pillow>=10,<13" "send2trash>=1.8,<3"
      - name: Test, freeze Python, embed worker and verify clean plugin installation
        run: python -B .github/scripts/build.py --goos ${{ matrix.goos }} --goarch ${{ matrix.goarch }} --target ${{ matrix.target }}
      # 冒烟测试已在本 runner (GLIBC 2.35) 上实际拉起 worker；这里再限制插件本体的符号版本。
      - name: Verify glibc requirement
        if: matrix.goos == 'linux'
        run: |
          required=$(objdump -T dist/gflow.so | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)
          echo "gflow.so requires GLIBC $required (max $MAX_GLIBC)"
          [ "$(printf '%s\n%s\n' "$required" "$MAX_GLIBC" | sort -V | tail -1)" = "$MAX_GLIBC" ]
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/verification-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.goos }}-${{ matrix.goarch }}
          include-hidden-files: true
          path: |
            .build/**/worker.log
            .build/freezer/**/*.txt
          if-no-files-found: ignore

  release:
    name: Release
    needs: [sync, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist-download
          pattern: dist-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: fork-changes
          path: fork-meta
        continue-on-error: true
      - name: Verify artifacts and write release notes
        env:
          VERSION: ${{ needs.sync.outputs.version }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          KEY: ${{ needs.sync.outputs.key }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          version, upstream_sha = os.environ["VERSION"], os.environ["UPSTREAM_SHA"]
          dist = Path("dist-download")
          platforms = [("darwin", "amd64", "dylib"), ("darwin", "arm64", "dylib"),
                       ("linux", "amd64", "so"), ("linux", "arm64", "so"), ("windows", "amd64", "dll")]
          sums = []
          for goos, goarch, ext in platforms:
              name = f"gflow_{version}_{goos}_{goarch}.zip"
              path = dist / name
              expected = (dist / (name + ".sha256")).read_text(encoding="utf-8").strip()
              assert expected == f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}", name
              evidence = json.loads((dist / f"verification-{goos}-{goarch}.json").read_text(encoding="utf-8"))
              assert evidence["version"] == version and evidence["clean_install_smoke"] == "passed", evidence
              with zipfile.ZipFile(path) as archive:
                  assert archive.namelist() == ["gflow." + ext] and archive.testzip() is None, name
              sums.append(expected)
          (dist / "checksums.txt").write_text("\n".join(sorted(sums)) + "\n", encoding="utf-8")
          notes = Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          match = re.search(rf"^# GFlow v{re.escape(version)}\s*$(.*?)(?=^# GFlow v|\Z)", notes, re.M | re.S)
          upstream = match.group(1).strip() if match else ""
          changes_file = Path("fork-meta/fork-changes.md")
          changes = changes_file.read_text(encoding="utf-8").strip() if changes_file.exists() else ""
          repo = os.environ["UPSTREAM_REPOSITORY"]
          body = (f"基于上游 [{repo} v{version}](https://github.com/{repo}/releases/tag/v{version})（`{upstream_sha[:12]}`）重新构建。\n\n"
                  f"- Linux 产物在 Ubuntu 22.04 构建，只需 GLIBC ≤ {os.environ['MAX_GLIBC']}（上游官方包需要 2.39，Ubuntu 22.04 / Debian 12 上 worker 无法启动）。\n"
                  "- macOS / Windows 产物与上游构建方式相同。\n"
                  "- 安装：解压对应平台 zip，用其中的 `gflow.so` 替换 CPA `plugins/<os>/<arch>/` 下的 `gflow-v*.so` 后重启 CPA。\n")
          if changes:
              body += "\n## Fork 改动\n\n" + changes + "\n"
          if upstream:
              body += "\n## 上游更新\n\n" + upstream + "\n"
          body += f"\n<!-- fork-key: {os.environ['KEY']} -->\n"
          Path("release-notes.md").write_text(body, encoding="utf-8")
          EOF
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.sync.outputs.tag }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --latest \
            --title "GFlow $TAG" --notes-file release-notes.md \
            dist-download/*.zip dist-download/checksums.txt
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/fork-build/$TAG" || true
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
