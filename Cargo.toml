[package]
name = "cpa-plugin-gflow"
version = "0.1.16"
edition = "2021"
authors = ["daodeqing"]
license = "MIT"
description = "Google Flow media generation, fixed project binding and account pool plugin for EasyCLIProxyAPI"
repository = "https://github.com/daodeqing/cpa-plugin-GFlow"

[lib]
name = "gflow"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
